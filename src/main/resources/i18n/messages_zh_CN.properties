# ====== 关于 / About ======
about.meta=德奥福安全玻璃有限公司，专业制造公交、客车及商用车层压玻璃和汽车配件。
about.kicker=WHO WE ARE
about.title=专业生产客车前挡风玻璃，<br/><em>服务全球每一段旅程。</em>
about.title.prefix=专业生产客车前挡风玻璃，<br/>
about.title.em=服务全球每一段旅程。
about.lead=德奥福（DEAOFU）是专业生产客车前挡风玻璃的制造企业。公司自成立以来发展迅猛，现已成为中国规模最大的汽车安全玻璃生产商之一，95% 的产品销往全球各地。
about.body=生产基地坐落于中国河南省，厂区面积超 10000 平方米，可适配 2000 余种客车挡风玻璃型号。产品已取得欧洲 ECE R43、美国 DOT、中国 3C 及南非 SABS 认证。企业严格依照 ISO9001 标准建立管理体系，配备独立质检部门，确保每一片玻璃都符合高标准。
about.audience.kicker=OUR AUDIENCE
about.audience.title=我们的目标受众
about.audience.1.title=公交车制造商
about.audience.1.desc=为公交车制造商提供耐用、高品质且符合安全法规的 OEM 玻璃解决方案。
about.audience.2.title=公交零部件分销商
about.audience.2.desc=玻璃产品可批发销售，为公交服务中心和维修店提供可靠库存。
about.audience.3.title=工厂与行业伙伴
about.audience.3.desc=专注公交挡风玻璃、长途汽车玻璃及定制玻璃制造，支持复杂车型开发与批量交付。
about.cap.kicker=FROM FACTORY TO ROAD
about.cap.title=每一道工序，<br/><em>都为真实道路负责。</em>
