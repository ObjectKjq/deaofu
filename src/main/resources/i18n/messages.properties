# ====== About page ======
about.meta=DEAOFU safety glass manufacturer: laminated glass and auto parts for buses, coaches and commercial vehicles.
about.kicker=WHO WE ARE
about.title=Professional bus windshield manufacturer,<br/><em>serving every journey worldwide.</em>
about.title.prefix=Professional bus windshield manufacturer,<br/>
about.title.em=serving every journey worldwide.
about.lead=DEAOFU is a professional manufacturer of bus front windshields. Since our founding we have grown rapidly to become one of China's largest safety glass producers, with 95% of our output exported worldwide.
about.body=Our production base is located in Henan Province, China, covering more than 10,000 square metres and capable of producing over 2,000 bus windshield models. Our products are certified to European ECE R43, US DOT, Chinese 3C and South African SABS standards. The company operates strictly under ISO9001 with an independent quality inspection team to ensure every piece of glass meets the highest standards.
about.audience.kicker=OUR AUDIENCE
about.audience.title=Our Target Audience
about.audience.1.title=Bus Manufacturers
about.audience.1.desc=Durable, high-quality OEM glass solutions that comply with safety regulations for bus makers.
about.audience.2.title=Bus Parts Distributors
about.audience.2.desc=Glass available for wholesale, providing reliable stock for bus service centres and workshops.
about.audience.3.title=Factories & Industry Partners
about.audience.3.desc=Bus windshields, coach glass and custom glass manufacturing, supporting complex vehicle development and bulk delivery.
about.cap.kicker=FROM FACTORY TO ROAD
