spring:
  application:
    name: backend
  datasource:
    # MySQL 8.0 连接配置，可通过环境变量覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/deaofu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useInformationSchema=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: deaofuHikariPool
      # 连接池参数适用于本地开发和小型后台服务，可按部署规模调整
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:100MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:110MB}
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
