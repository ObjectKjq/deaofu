<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="description" th:content="${newsItem.summary}"/>
    <title th:text="#{meta.title.news_detail(${newsItem.title})}">News Detail | DEAOFU</title>
    <link rel="stylesheet" th:href="@{/portal/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/portal/css/product-pages.css}"/>
    <link rel="stylesheet" th:href="@{/portal/css/news-pages.css}"/>
</head>
<body class="news-page">
<div th:replace="~{portal/fragments :: header('news')}"></div>
<main class="page-main news-detail-main">
    <div class="news-detail-wrap">
        <nav class="news-detail-breadcrumb" th:attr="aria-label=#{common.aria.breadcrumb}">
            <a th:href="@{/}" th:text="#{common.nav.home}">Home</a>
            <span>/</span>
            <a th:href="@{/news(language=${language})}" th:text="#{common.nav.news}">News</a>
            <span>/</span>
            <span th:with="defaultTag=#{home.news.default_tag}" th:text="${#lists.isEmpty(newsItem.tags) ? defaultTag : newsItem.tags[0].tagName}">Company News</span>
        </nav>
        <div class="news-article-layout">
            <div class="news-article-content">
                <h1 th:text="${newsItem.title}"></h1>
                <p class="news-article-lede" th:text="${newsItem.summary}"></p>
                <div th:utext="${newsItem.content}"></div>
            </div>
            <aside class="news-article-aside">
                <div class="news-article-meta">
                    <span th:with="defaultTag=#{home.news.default_tag}" th:text="${#lists.isEmpty(newsItem.tags) ? defaultTag : newsItem.tags[0].tagName}">Company News</span>
                    <time th:attr="datetime=${#dates.format(newsItem.createTime, 'yyyy-MM-dd')}" th:text="${#dates.format(newsItem.createTime, 'yyyy.MM.dd')}"></time>
                </div>
                <b th:text="#{news-detail.project}">Project Information</b>
                <dl>
                    <div th:if="${newsItem.projectRegion != null}">
                        <dt th:text="#{news-detail.region}">Project Region</dt>
                        <dd th:text="${newsItem.projectRegion}"></dd>
                    </div>
                    <div th:if="${newsItem.contactEmail != null}">
                        <dt th:text="#{news-detail.email}">Contact Email</dt>
                        <dd th:text="${newsItem.contactEmail}"></dd>
                    </div>
                </dl>
                <a class="text-link" th:href="@{/contact}"><span th:text="#{news-detail.consult}">Inquire Partnership</span> <span>→</span></a>
            </aside>
        </div>
    </div>
</main>
<div th:replace="~{portal/fragments :: footer}"></div>
<script th:src="@{/portal/js/main.js}"></script>
</body>
</html>
