<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="联系德奥福汽车玻璃厂有限公司，获取专业商用车玻璃解决方案。" />
  <title>联系我们 | DEAOFU 德奥福</title>
  <link rel="stylesheet" th:href="@{/portal/css/styles.css}" />
  <link rel="stylesheet" th:href="@{/portal/css/contact.css}" />
</head>
<body class="contact-page">
  <div th:replace="~{portal/fragments :: header('contact')}"></div>
  <main class="page-main">
    <section class="contact-form-section">
      <div class="container contact-head-wrap">
        <h1 class="contact-heading">联系我们</h1>
        <p class="contact-desc">请填写以下表单，我们的专业顾问将尽快为您服务</p>
      </div>
      <div class="container contact-layout">
        <form class="contact-form" id="contactForm" novalidate>
          <div>
            <label><em>*</em> 咨询主题</label>
            <div class="contact-checkboxes" id="topicGroup">
              <label class="contact-checkbox"><input type="checkbox" name="topic" value="产品及解决方案咨询" /><span>产品及解决方案咨询</span></label>
              <label class="contact-checkbox"><input type="checkbox" name="topic" value="价格咨询" /><span>价格咨询</span></label>
              <label class="contact-checkbox"><input type="checkbox" name="topic" value="项目合作" /><span>项目合作</span></label>
              <label class="contact-checkbox"><input type="checkbox" name="topic" value="现场演示支持" /><span>现场演示支持</span></label>
              <label class="contact-checkbox"><input type="checkbox" name="topic" value="其他" /><span>其他</span></label>
            </div>
          </div>

          <div>
            <label for="msg"><em>*</em> 咨询内容</label>
            <textarea id="msg" name="message" required></textarea>
            <span class="field-error">请填写咨询内容</span>
          </div>

          <div>
            <label for="name"><em>*</em> 姓名</label>
            <input type="text" id="name" name="name" required />
            <span class="field-error">请填写您的姓名</span>
          </div>

          <div>
            <label for="phone">电话</label>
            <div class="contact-phone-field"><span class="contact-phone-prefix">+86</span><input type="tel" id="phone" name="phone" /></div>
          </div>

          <div>
            <label for="email"><em>*</em> 邮箱</label>
            <input type="email" id="email" name="email" required />
            <span class="field-error">请填写正确的邮箱地址</span>
            <span class="field-hint">我们将通过该邮箱与您联系</span>
          </div>

          <button class="btn-submit" type="submit">提交咨询</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>

        <aside class="contact-info-side">
          <h3>联系方式</h3>
          <div class="contact-info-list">
            <div class="contact-info-item">
              <b>邮箱</b>
              <a href="mailto:dafbusglass@163.com">dafbusglass@163.com</a>
            </div>
            <div class="contact-info-item">
              <b>电话 / WhatsApp</b>
              <a href="tel:+8617737159530">+86 177 3715 9530</a>
            </div>
            <div class="contact-info-item">
              <b>地址</b>
              <span>中国 · 河南省周口市通远11路</span>
            </div>
            <div class="contact-info-item">
              <b>社交媒体</b>
              <span>Facebook · Twitter / X · YouTube · TikTok · Instagram</span>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <div th:replace="~{portal/fragments :: footer}"></div>
  <script th:src="@{/portal/js/contact.js}"></script>
</body>
</html>
