<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="description" th:content="#{products.meta}"/>
    <title th:text="#{meta.title.products}">Products | DEAOFU</title>
    <link rel="stylesheet" th:href="@{/portal/vendor/fonts/fonts.css}"/>
    <link rel="stylesheet" th:href="@{/portal/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/portal/css/product-pages.css}"/>
    <link rel="stylesheet" th:href="@{/portal/css/overrides.css}"/>
    <link rel="stylesheet" th:href="@{/portal/css/page-enhancements.css(v=20261024)}"/>
</head>
<body class="product-page">
<div th:replace="~{portal/fragments :: header('products')}"></div>
<main class="page-main">
    <section class="container products-layout">
        <!-- 首次渲染即使用收起布局，避免等待脚本加载时先展开后收起。 -->
        <aside class="product-filter is-enhanced" th:attr="aria-label=#{common.aria.product_filter}">
            <h2 th:text="#{products.filter.title}">Filter Products</h2>
            <button class="product-filter-toggle" id="productFilterToggle" type="button" aria-expanded="false" aria-controls="productFilterGroups">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor" stroke="none"/><circle cx="15" cy="17" r="3" fill="currentColor" stroke="none"/></svg>
                <span class="product-filter-label"><strong th:text="#{products.filter.title}">Filter Products</strong><span id="productFilterSelection" th:text="#{products.filter.all}">All Products</span></span>
                <span class="filter-chevron" aria-hidden="true"></span>
            </button>
            <div class="filter-groups" id="productFilterGroups">
                <a class="filter-all" th:classappend="${query.categoryId == null} ? ' is-active'" th:attr="aria-current=${query.categoryId == null ? 'true' : null}" th:href="@{/products(keyword=${query.keyword},language=${query.language})}" th:text="#{products.filter.all}">All Products</a>
                <div class="filter-group is-collapsed" th:each="parent, stat : ${categories}" th:if="${parent.level == 1}">
                    <button class="filter-group-title" type="button" aria-expanded="false" th:attr="aria-controls=|filter-options-${stat.index}|" th:text="${parent.categoryName}">Category</button>
                    <div class="filter-options" th:id="|filter-options-${stat.index}|" hidden>
                        <a class="filter-option" th:each="child : ${categories}" th:if="${child.parentId == parent.categoryId}" th:classappend="${child.categoryId == query.categoryId} ? ' is-active'" th:attr="aria-current=${child.categoryId == query.categoryId ? 'true' : null}" th:href="@{/products(categoryId=${child.categoryId},keyword=${query.keyword},language=${query.language})}" th:text="${child.categoryName}">Subcategory</a>
                    </div>
                </div>
            </div>
        </aside>
        <div class="product-results">
            <div class="product-results-tools">
                <form class="product-search" id="productSearchForm" role="search" th:action="@{/products}" method="get">
                    <input type="hidden" name="categoryId" th:value="${query.categoryId}"/>
                    <input type="hidden" name="language" th:value="${query.language}"/>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                    <input id="productSearch" type="search" name="keyword" th:placeholder="#{common.search.placeholder}" autocomplete="off" th:attr="aria-label=#{common.search.label}" th:value="${query.keyword}"/>
                    <button type="submit" th:text="#{common.btn.search}">Search</button>
                </form>
            </div>
            <div class="product-results-head">
                <div><h1 id="resultTitle" th:text="${query.keyword != null && !query.keyword.isEmpty()} ? #{products.results.search.prefix} + ${query.keyword} : #{products.results.all}">All Products</h1>
                    <p th:text="#{products.results.subtitle}">Click a product card...</p></div>
                <a class="filter-reset" id="productFilterReset" th:href="@{/products(language=${query.language})}" th:hidden="${query.categoryId == null && (query.keyword == null || query.keyword.isEmpty())}" th:text="#{common.filters.clear}">Clear filters</a>
            </div>
            <div class="results-meta"><span id="productResultCount" th:text="#{products.results.count(${productTotal})}"></span><span class="results-status" id="productResultsStatus" role="status" aria-live="polite"></span></div>
            <div class="product-grid-page" id="productGrid" data-lazy-grid data-lazy-url="/api/products" th:attr="data-lazy-category-id=${query.categoryId},data-lazy-keyword=${query.keyword},data-lazy-language=${query.language},data-lazy-size=${query.pageSize},data-lazy-total=${productTotal},data-lazy-page=${query.pageNum}">
                <a class="catalog-card" th:each="item, stat : ${products}" th:href="@{/product/{id}(id=${item.productId},language=${query.language})}">
                    <div class="catalog-card-media">
                        <img th:if="${item.coverUrl != null}" th:src="${item.coverUrl}" th:alt="${item.title}" loading="lazy"/>
                        <span class="catalog-card-tag" th:text="${item.categoryName}"></span>
                    </div>
                    <div class="catalog-card-body">
                        <span class="catalog-card-code" th:text="'P-' + ${#numbers.formatInteger(stat.count, 2, 'NONE')} + ' / ' + ${item.categoryName}"></span>
                        <h3 th:text="${item.title}"></h3>
                        <p th:text="${item.summary}"></p>
                        <div class="catalog-card-footer">
                            <span class="catalog-card-spec" th:text="${item.parentCategoryName != null ? item.parentCategoryName + ' · ' + item.categoryName : item.categoryName}"></span>
                            <span class="catalog-card-link"><span th:text="#{common.btn.view_detail}">View Details</span> <span>↗</span></span>
                        </div>
                    </div>
                </a>
                <div class="catalog-empty" th:if="${#lists.isEmpty(products)}">
                    <strong th:text="#{products.empty}">No matching products found</strong>
                    <span th:text="#{products.empty_desc}">Try changing keywords or filter criteria.</span>
                </div>
                <th:block th:if="${!#lists.isEmpty(products)}">
                    <div class="lazy-sentinel" data-lazy-sentinel aria-hidden="true">
                        <span class="lazy-spinner" data-lazy-spinner></span>
                        <span class="lazy-text" data-lazy-text th:text="#{products.lazy_loading}">Loading more...</span>
                    </div>
                    <div class="lazy-end" data-lazy-end hidden th:text="#{products.lazy_end}">You've reached the end</div>
                </th:block>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{portal/fragments :: footer}"></div>
<script th:src="@{/portal/vendor/gsap/gsap.min.js}"></script>
<script th:src="@{/portal/vendor/gsap/ScrollTrigger.min.js}"></script>
<script th:src="@{/portal/js/main.js}"></script>
<script defer th:src="@{/portal/js/lazy-load.js(v=20260901001)}"></script>
</body>
</html>
