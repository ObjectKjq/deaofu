<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="DEAOFU 德奥福产品中心，公交车玻璃及商用车汽车配件，支持 OEM 定制与全球交付。" />
  <title>产品中心 | DEAOFU 德奥福</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/portal/css/styles.css}" />
  <link rel="stylesheet" th:href="@{/portal/css/product-pages.css}" />
</head>
<body class="product-page">
  <div th:replace="~{portal/fragments :: header('products')}"></div>
  <main class="page-main">
    <section class="container products-layout">
      <aside class="product-filter" aria-label="产品筛选">
        <h2>筛选产品</h2>
        <div class="filter-groups">
          <a class="filter-all" th:classappend="${query.categoryId == null} ? ' is-active'" th:href="@{/products}" th:text="'全部产品'">全部产品</a>
          <div class="filter-group is-collapsed" th:each="parent, stat : ${categories}" th:if="${parent.level == 1}">
            <button class="filter-group-title" type="button" aria-expanded="false"
                    th:attr="aria-controls=|filter-options-${stat.index}|"
                    th:text="${parent.categoryName}">产品类别</button>
            <div class="filter-options" th:id="|filter-options-${stat.index}|">
              <a class="filter-option" th:each="child : ${categories}"
                 th:if="${child.parentId == parent.categoryId}"
                 th:classappend="${child.categoryId == query.categoryId} ? ' is-active'"
                 th:href="@{/products(categoryId=${child.categoryId})}"
                 th:text="${child.categoryName}">分类</a>
            </div>
          </div>
        </div>
      </aside>
      <div class="product-results">
        <div class="product-results-tools">
          <form class="product-search" id="productSearchForm" role="search" th:action="@{/products}" method="get">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input id="productSearch" type="search" name="keyword" placeholder="搜索产品名称、类别或关键词" autocomplete="off" aria-label="搜索产品名称、类别或关键词" th:value="${query.keyword}" />
            <button type="submit">搜索</button>
          </form>
        </div>
        <div class="product-results-head">
          <h2 id="resultTitle" th:text="${query.keyword != null && !query.keyword.isEmpty()} ? '搜索：' + ${query.keyword} : '全部产品'">全部产品</h2>
          <p>点击产品卡片查看规格、应用与询价方式</p>
        </div>
        <div class="product-grid-page" id="productGrid">
          <a class="catalog-card" th:each="item, stat : ${products}" th:href="@{/product/{id}(id=${item.productId})}">
            <div class="catalog-card-media">
              <img th:if="${item.coverUrl != null}" th:src="${item.coverUrl}" th:alt="${item.title}" loading="lazy" />
              <span class="catalog-card-tag" th:text="${item.categoryName}"></span>
            </div>
            <div class="catalog-card-body">
              <span class="catalog-card-code" th:text="'P-' + ${#numbers.formatInteger(stat.count, 2, 'NONE')} + ' / ' + ${item.categoryName}"></span>
              <h3 th:text="${item.title}"></h3>
              <p th:text="${item.summary}"></p>
              <div class="catalog-card-footer">
                <span class="catalog-card-spec" th:text="${item.parentCategoryName != null ? item.parentCategoryName + ' · ' + item.categoryName : item.categoryName}"></span>
                <span class="catalog-card-link">查看详情 <span>↗</span></span>
              </div>
            </div>
          </a>
          <div class="catalog-empty" th:if="${#lists.isEmpty(products)}"><strong>没有找到匹配的产品</strong>请尝试更换关键词或筛选条件。</div>
        </div>
      </div>
    </section>
  </main>
  <div th:replace="~{portal/fragments :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script th:src="@{/portal/js/main.js}"></script>
</body>
</html>
