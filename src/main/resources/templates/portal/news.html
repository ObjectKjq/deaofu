<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="德奥福汽车玻璃厂有限公司公司动态、客户案例与产品资讯。" />
  <title>公司动态 | DEAOFU 德奥福</title>
  <link rel="stylesheet" th:href="@{/portal/vendor/fonts/fonts.css}" />
  <link rel="stylesheet" th:href="@{/portal/css/styles.css}" />
  <link rel="stylesheet" th:href="@{/portal/css/product-pages.css}" />
  <link rel="stylesheet" th:href="@{/portal/css/news-pages.css}" />
</head>
<body class="product-page news-page">
  <div th:replace="~{portal/fragments :: header('news')}"></div>
  <main class="page-main news-main">
    <section class="news-browser" aria-label="公司动态列表">
      <div class="container">
        <div class="news-tags" id="newsTags" role="tablist" aria-label="动态分类">
          <a class="news-tag" th:classappend="${query.tagId == null} ? ' is-active'" th:href="@{/news}">全部动态</a>
          <a class="news-tag" th:each="tag : ${tags}" th:classappend="${tag.tagId == query.tagId} ? ' is-active'" th:href="@{/news(tagId=${tag.tagId})}">
            <img th:if="${tag.iconUrl != null}" th:src="${tag.iconUrl}" th:alt="${tag.tagName + ' 图标'}" />
            <span th:text="${tag.tagName}"></span>
          </a>
        </div>
        <div class="news-results-head">
          <div><p class="kicker">LATEST STORIES</p><h2 id="newsResultTitle">全部动态</h2></div>
        </div>
        <div class="news-center-grid" id="newsGrid">
          <a class="news-center-card" th:each="item : ${news}" th:href="@{/news/{id}(id=${item.newsId})}">
            <div class="news-center-media">
              <img th:if="${item.coverUrl != null}" th:src="${item.coverUrl}" th:alt="${item.title}" loading="lazy" />
              <span class="news-center-category" th:text="${#lists.isEmpty(item.tags) ? '公司动态' : item.tags[0].tagName}"></span>
            </div>
            <div class="news-center-body">
              <div class="news-center-meta">
                <span th:text="${#lists.isEmpty(item.tags) ? '公司动态' : item.tags[0].tagName}"></span>
                <time th:attr="datetime=${#dates.format(item.createTime, 'yyyy-MM-dd')}" th:text="${#dates.format(item.createTime, 'yyyy.MM.dd')}"></time>
              </div>
              <h3 th:text="${item.title}"></h3>
              <p th:text="${item.summary}"></p>
              <span class="news-center-link">阅读详情 <span>↗</span></span>
            </div>
          </a>
        </div>
        <div class="news-empty" th:if="${#lists.isEmpty(news)}">
          <strong>没有找到匹配的动态</strong>
          <p>请尝试切换其他分类。</p>
          <a class="button detail-outline" th:href="@{/news}">查看全部动态</a>
        </div>
      </div>
    </section>
  </main>
  <div th:replace="~{portal/fragments :: footer}"></div>
  <script th:src="@{/portal/vendor/gsap/gsap.min.js}"></script>
  <script th:src="@{/portal/vendor/gsap/ScrollTrigger.min.js}"></script>
  <script th:src="@{/portal/js/main.js}"></script>
</body>
</html>
