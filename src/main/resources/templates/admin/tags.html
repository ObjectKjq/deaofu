<section class="module-view" data-admin-module="tags">
    <article class="panel-card module-panel no-shadow">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input type="text" data-keyword placeholder="搜索关键字，按 Enter 查询">
                <button data-search>查询</button>
            </div>
            <div class="toolbar-actions">
                <button class="primary-button" data-add-record>
                    <i class="layui-icon layui-icon-add-1"></i><span>新增标签</span>
                </button>
                <button class="ghost-button" data-refresh>
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
            </div>
        </div>
        <table id="admin-data-table" lay-filter="admin-data-table"></table>
    </article>
</section>

<script type="application/json" id="module-config-tags">
{
    "endpoint": "/admin/news-tags",
    "id": "tagId",
    "page": false,
    "title": "动态标签",
    "addLabel": "新增标签",
    "deleteLabel": "标签",
    "columns": [
        {"field": "tagName", "title": "标签名称", "minWidth": 180, "type": "title"},
        {"field": "createTime", "title": "创建时间", "width": 170}
    ],
    "fields": [
        {"name": "tagName", "label": "标签名称", "type": "text", "required": true, "wide": true},
        {"name": "iconBase64", "label": "标签图标", "type": "icon", "wide": true}
    ]
}
</script>

<script type="text/html" id="module-editor-tags">
    <div class="admin-editor">
        <div class="editor-grid">
            <div class="editor-field is-wide">
                <label class="required">标签名称</label>
                <input class="editor-input" type="text" name="tagName">
            </div>
            <div class="editor-field is-wide">
                <label>标签图标</label>
                <div class="upload-box">
                    <div class="upload-preview" data-preview="iconBase64">
                        <i class="layui-icon layui-icon-picture"></i>
                    </div>
                    <div class="upload-control">
                        <strong>点击上传图标</strong>
                        <small>图标将以 Base64 形式随标签保存</small>
                        <button type="button" class="deaofu-upload-btn"
                                data-upload-field="iconBase64" data-upload-kind="icon">
                            <i class="layui-icon layui-icon-upload"></i> 上图片标
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="admin-row-actions">
    <div class="row-actions">
        <button class="row-action edit" lay-event="edit">编辑</button>
        <button class="row-action delete" lay-event="delete">删除</button>
    </div>
</script>
