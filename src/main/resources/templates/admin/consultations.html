<div class="layui-fluid module-page" data-module="consultations">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <form data-filter>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">信息搜索</label>
                        <div class="layui-input-inline"><input class="layui-input" name="keyword"
                                                               placeholder="联系人、邮箱或咨询内容"></div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" type="submit">查询</button>
                        <button class="layui-btn layui-btn-primary" type="reset" data-action="reset">重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-card-body">
            <div class="table-wrap">
                <table class="layui-table">
                    <thead>
                    <tr>
                        <th>联系人</th>
                        <th>联系方式</th>
                        <th>咨询主题</th>
                        <th>咨询摘要</th>
                        <th>提交时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody data-list></tbody>
                </table>
            </div>
            <div class="table-footer" data-pagination></div>
        </div>
    </div>
</div>
