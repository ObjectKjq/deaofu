<section class="module-view" data-admin-module="news">
    <article class="panel-card module-panel no-shadow">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input type="text" data-keyword placeholder="搜索关键字，按 Enter 查询">
                <button data-search>查询</button>
            </div>
            <div class="toolbar-actions">
                <button class="primary-button" data-add-record>
                    <i class="layui-icon layui-icon-add-1"></i><span>新增动态</span>
                </button>
                <button class="ghost-button" data-refresh>
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
            </div>
        </div>
        <table id="admin-data-table" lay-filter="admin-data-table"></table>
    </article>
</section>

<script type="application/json" id="module-config-news">
{
    "endpoint": "/admin/news",
    "id": "newsId",
    "page": true,
    "title": "公司动态",
    "addLabel": "新增动态",
    "deleteLabel": "动态",
    "columns": [
        {"field": "title", "title": "动态标题", "minWidth": 220, "type": "title"},
        {"field": "tags", "title": "关联标签", "minWidth": 160, "type": "tags"},
        {"field": "createTime", "title": "创建时间", "width": 165},
        {"field": "updateTime", "title": "更新时间", "width": 165}
    ],
    "fields": [
        {"name": "title", "label": "动态标题", "type": "text", "required": true, "wide": true},
        {"name": "coverAccessName", "label": "封面图片", "type": "file", "required": true},
        {"name": "tagIds", "label": "关联标签", "type": "tags", "wide": true},
        {"name": "content", "label": "动态正文", "type": "richtext", "required": true, "wide": true}
    ]
}
</script>

<script type="text/html" id="module-editor-news">
    <div class="admin-editor">
        <div class="editor-grid">
            <div class="editor-field is-wide">
                <label class="required">动态标题</label>
                <input class="editor-input" type="text" name="title">
            </div>
            <div class="editor-field">
                <label class="required">封面图片</label>
                <div class="upload-box">
                    <div class="upload-preview" data-preview="coverAccessName">
                        <i class="layui-icon layui-icon-picture"></i>
                    </div>
                    <div class="upload-control">
                        <strong>点击上传封面</strong>
                        <small>支持 JPG / PNG / WEBP 等图片格式</small>
                        <button type="button" class="deaofu-upload-btn"
                                data-upload-field="coverAccessName" data-upload-kind="file">
                            <i class="layui-icon layui-icon-upload"></i> 上传图片
                        </button>
                        <input type="hidden" name="coverAccessName">
                    </div>
                </div>
            </div>
            <div class="editor-field is-wide">
                <label>关联标签</label>
                <div class="tag-options">
                    <span class="muted">暂无标签，请先创建动态标签</span>
                </div>
            </div>
            <div class="editor-field is-wide">
                <label class="required">动态正文</label>
                <div class="rich-toolbar">
                    <button type="button" class="deaofu-tool-btn" data-command="bold"><b>B</b></button>
                    <button type="button" class="deaofu-tool-btn" data-command="italic"><i>I</i></button>
                    <button type="button" class="deaofu-tool-btn" data-command="insertUnorderedList">项目列表</button>
                    <label class="deaofu-tool-btn">
                        插入图片
                        <input type="file" accept="image/*" data-rich-image hidden>
                    </label>
                </div>
                <div class="rich-editor" contenteditable="true" data-rich-editor></div>
                <p class="editor-help">正文保存为 HTML；插入的图片会以内嵌 Base64 方式随正文保存。</p>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="admin-row-actions">
    <div class="row-actions">
        <button class="row-action edit" lay-event="edit">编辑</button>
        <button class="row-action delete" lay-event="delete">删除</button>
    </div>
</script>
