<div class="layui-fluid module-page" data-module="news">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <form data-filter>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">动态搜索</label>
                        <div class="layui-input-inline"><input class="layui-input" name="keyword"
                                                               placeholder="标题或摘要"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">动态标签</label>
                        <div class="layui-input-inline"><select name="tagId" data-tag-filter>
                            <option value="">全部标签</option>
                        </select></div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" type="submit">查询</button>
                        <button class="layui-btn layui-btn-primary" type="reset" data-action="reset">重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-card-body">
            <div class="toolbar">
                <button class="layui-btn" data-action="create"><i class="layui-icon layui-icon-add-1"></i>添加动态
                </button>
            </div>
            <div class="table-wrap">
                <table class="layui-table">
                    <thead>
                    <tr>
                        <th>封面</th>
                        <th>动态标题</th>
                        <th>动态标签</th>
                        <th>动态简介</th>
                        <th>项目地区</th>
                        <th>咨询邮箱</th>
                        <th>创建人</th>
                        <th>创建时间</th>
                        <th>首页展示</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody data-list></tbody>
                </table>
            </div>
            <div class="table-footer" data-pagination></div>
        </div>
    </div>
</div>
