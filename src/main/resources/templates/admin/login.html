<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>登录 | DEAOFU 管理后台</title>
    <link rel="stylesheet" th:href="@{/admin/layui/css/layui.css}">
    <link rel="stylesheet" th:href="@{/admin/style/admin.css}">
    <link rel="stylesheet" th:href="@{/admin/style/login.css}">
    <link rel="stylesheet" th:href="@{/admin/css/replica.css}">
</head>
<body class="layui-layout-body">
<div class="layadmin-user-login layadmin-user-display-show" id="LAY-user-login">
    <div class="layadmin-user-login-main">
        <div class="layadmin-user-login-box layadmin-user-login-header">
            <h2>DEAOFU</h2>
            <p>德奥福汽车玻璃运营管理系统</p>
        </div>
        <form id="login-form" class="layadmin-user-login-box layadmin-user-login-body layui-form">
            <div class="layui-form-item">
                <label class="layadmin-user-login-icon layui-icon layui-icon-username" for="login-username"></label>
                <input class="layui-input"
                       id="login-username" name="username"
                       autocomplete="username" required
                       placeholder="用户名"></div>
            <div class="layui-form-item">
                <label class="layadmin-user-login-icon layui-icon layui-icon-password"
                       for="login-password"></label>
                <input class="layui-input"
                       id="login-password" name="password"
                       type="password"
                       autocomplete="current-password"
                       required placeholder="密码"></div>
            <div class="layui-form-item">
                <button class="layui-btn layui-btn-fluid" type="submit">登 入</button>
            </div>
        </form>
    </div>
    <div class="layui-trans layadmin-user-login-footer"><p>© DEAOFU 汽车玻璃有限公司</p></div>
</div>
<script th:src="@{/admin/layui/layui.js}"></script>
<script th:src="@{/admin/js/admin.js(v='20260901-home-order-dialog-2')}"></script>
</body>
</html>
