<section class="module-view" th:attr="data-admin-module=${module}" data-admin-module="products">
    <div class="page-heading module-heading">
        <div><span class="eyebrow" data-module-eyebrow>CONTENT MANAGEMENT</span>
            <h1 data-module-title>模块管理</h1>
            <p data-module-description>管理企业官网业务内容。</p></div>
        <button class="primary-button" data-add-record><i class="layui-icon layui-icon-add-1"></i><span data-add-label>新增</span>
        </button>
    </div>
    <article class="panel-card module-panel">
        <div class="table-toolbar">
            <div class="search-box"><i class="layui-icon layui-icon-search"></i><input type="text" data-keyword
                                                                                       placeholder="搜索关键字，按 Enter 查询">
                <button data-search>查询</button>
            </div>
            <div class="toolbar-actions">
                <button class="ghost-button" data-refresh><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
            </div>
        </div>
        <table id="admin-data-table" lay-filter="admin-data-table"></table>
    </article>
</section>
<script type="text/html" id="admin-row-actions">
    <div class="row-actions">
        <button class="row-action edit" lay-event="edit">编辑</button>
        <button class="row-action delete" lay-event="delete">删除</button>
    </div></script>
