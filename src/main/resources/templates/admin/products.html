<div class="layui-fluid module-page" data-module="products">
    <div class="layui-card">
        <div class="layui-form layui-card-header layuiadmin-card-header-auto">
            <form data-filter>
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">产品搜索</label>
                        <div class="layui-input-inline"><input class="layui-input" name="keyword"
                                                               placeholder="请输入产品名称"></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">语言</label>
                        <div class="layui-input-inline"><select name="language">
                            <option value="">全部语言</option><option value="0">中文</option><option value="1">英语</option>
                        </select></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">产品分类</label>
                        <div class="layui-input-inline"><select name="categoryId" data-category-filter>
                            <option value="">全部分类</option>
                        </select></div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label">首页展示</label>
                        <div class="layui-input-inline"><select name="homeShow">
                            <option value="" selected></option>
                            <option value="1">首页展示</option>
                            <option value="0">普通内容</option>
                        </select></div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" type="submit">查询</button>
                        <button class="layui-btn layui-btn-primary" type="reset" data-action="reset">重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-card-body">
            <div class="toolbar">
                <button class="layui-btn" data-action="create"><i class="layui-icon layui-icon-add-1"></i>添加产品
                </button>
            </div>
            <div class="table-wrap">
                <table class="layui-table">
                    <thead>
                    <tr>
                        <th>产品标题</th>
                        <th>产品分类</th>
                        <th>封面图</th>
                        <th>产品简介</th>
                        <th>产品参数</th>
                        <th>详情图</th>
                        <th>创建人</th>
                        <th>创建时间</th>
                        <th>首页展示</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody data-list></tbody>
                </table>
            </div>
            <div class="table-footer" data-pagination></div>
        </div>
    </div>
</div>
