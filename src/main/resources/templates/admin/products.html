<section class="module-view" data-admin-module="products">
    <article class="panel-card module-panel no-shadow">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input type="text" data-keyword placeholder="搜索关键字，按 Enter 查询">
                <button data-search>查询</button>
            </div>
            <div class="toolbar-actions">
                <button class="primary-button" data-add-record>
                    <i class="layui-icon layui-icon-add-1"></i><span>新增产品</span>
                </button>
                <button class="ghost-button" data-refresh>
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
            </div>
        </div>
        <table id="admin-data-table" lay-filter="admin-data-table"></table>
    </article>
</section>

<script type="application/json" id="module-config-products">
{
    "endpoint": "/admin/products",
    "id": "productId",
    "page": true,
    "title": "产品管理",
    "addLabel": "新增产品",
    "deleteLabel": "产品",
    "columns": [
        {"field": "coverUrl", "title": "封面", "width": 78, "type": "image"},
        {"field": "title", "title": "产品标题", "minWidth": 190, "type": "title"},
        {"field": "parentCategoryName", "title": "一级分类", "width": 130},
        {"field": "categoryName", "title": "二级分类", "width": 140},
        {"field": "detailImages", "title": "详情图片", "width": 100, "type": "imageCount"},
        {"field": "updateTime", "title": "更新时间", "width": 165}
    ],
    "fields": [
        {"name": "title", "label": "产品标题", "type": "text", "required": true, "wide": true},
        {"name": "categoryId", "label": "产品二级分类", "type": "category-select", "required": true},
        {"name": "coverAccessName", "label": "产品封面", "type": "file", "required": true},
        {"name": "summary", "label": "产品简介", "type": "textarea", "wide": true},
        {"name": "detailImages", "label": "详情图片", "type": "multi-file", "required": true, "wide": true},
        {"name": "parameters", "label": "参数信息", "type": "json-params", "required": true, "wide": true}
    ]
}
</script>

<script type="text/html" id="module-editor-products">
    <div class="admin-editor">
        <div class="editor-grid">
            <div class="editor-field is-wide">
                <label class="required">产品标题</label>
                <input class="editor-input" type="text" name="title">
            </div>
            <div class="editor-field">
                <label class="required">产品二级分类</label>
                <select class="editor-select" name="categoryId" lay-search lay-filter="categoryId">
                    <option value="">请选择二级分类</option>
                </select>
            </div>
            <div class="editor-field">
                <label class="required">产品封面</label>
                <div class="upload-box">
                    <div class="upload-preview" data-preview="coverAccessName">
                        <i class="layui-icon layui-icon-picture"></i>
                    </div>
                    <div class="upload-control">
                        <strong>点击上传封面</strong>
                        <small>支持 JPG / PNG / WEBP 等图片格式</small>
                        <button type="button" class="deaofu-upload-btn"
                                data-upload-field="coverAccessName" data-upload-kind="file">
                            <i class="layui-icon layui-icon-upload"></i> 上传图片
                        </button>
                        <input type="hidden" name="coverAccessName">
                    </div>
                </div>
            </div>
            <div class="editor-field is-wide">
                <label>产品简介</label>
                <textarea class="editor-textarea" name="summary"></textarea>
            </div>
            <div class="editor-field is-wide">
                <label class="required">详情图片</label>
                <div class="upload-box">
                    <div class="upload-control">
                        <strong>点击上传详情图片</strong>
                        <small>可一次选择多张图片，提交前可移除</small>
                        <button type="button" class="deaofu-upload-btn"
                                data-upload-field="detailImages" data-upload-kind="file" data-upload-multiple="true">
                            <i class="layui-icon layui-icon-upload"></i> 选择多张图片
                        </button>
                        <div class="multi-preview" data-multi-preview="detailImages"></div>
                    </div>
                </div>
            </div>
            <div class="editor-field is-wide">
                <label class="required">参数信息</label>
                <textarea class="editor-textarea" name="parameters" rows="7"></textarea>
                <p class="editor-help">JSON 数组格式：[{"label":"厚度范围","value":"4.76 - 12 mm"}]</p>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="admin-row-actions">
    <div class="row-actions">
        <button class="row-action edit" lay-event="edit">编辑</button>
        <button class="row-action delete" lay-event="delete">删除</button>
    </div>
</script>
