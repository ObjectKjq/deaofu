<section class="module-view" data-admin-module="partners">
    <article class="panel-card module-panel no-shadow">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input type="text" data-keyword placeholder="搜索关键字，按 Enter 查询">
                <button data-search>查询</button>
            </div>
            <div class="toolbar-actions">
                <button class="primary-button" data-add-record>
                    <i class="layui-icon layui-icon-add-1"></i><span>新增企业</span>
                </button>
                <button class="ghost-button" data-refresh>
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
            </div>
        </div>
        <table id="admin-data-table" lay-filter="admin-data-table"></table>
    </article>
</section>

<script type="application/json" id="module-config-partners">
{
    "endpoint": "/admin/partner-companies",
    "id": "partnerId",
    "page": true,
    "title": "合作企业",
    "addLabel": "新增企业",
    "deleteLabel": "企业",
    "columns": [
        {"field": "companyName", "title": "企业名称", "minWidth": 190, "type": "title"},
        {"field": "logoUrl", "title": "Logo", "width": 90, "type": "image"},
        {"field": "createTime", "title": "创建时间", "width": 170},
        {"field": "updateTime", "title": "更新时间", "width": 170}
    ],
    "fields": [
        {"name": "companyName", "label": "企业名称", "type": "text", "required": true, "wide": true},
        {"name": "logoAccessName", "label": "企业 Logo", "type": "file", "required": true, "wide": true}
    ]
}
</script>

<script type="text/html" id="module-editor-partners">
    <div class="admin-editor">
        <div class="editor-grid">
            <div class="editor-field is-wide">
                <label class="required">企业名称</label>
                <input class="editor-input" type="text" name="companyName">
            </div>
            <div class="editor-field is-wide">
                <label class="required">企业 Logo</label>
                <div class="upload-box">
                    <div class="upload-preview" data-preview="logoAccessName">
                        <i class="layui-icon layui-icon-picture"></i>
                    </div>
                    <div class="upload-control">
                        <strong>点击上传企业 Logo</strong>
                        <small>支持 JPG / PNG / WEBP 等图片格式</small>
                        <button type="button" class="deaofu-upload-btn"
                                data-upload-field="logoAccessName" data-upload-kind="file">
                            <i class="layui-icon layui-icon-upload"></i> 上传图片
                        </button>
                        <input type="hidden" name="logoAccessName">
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="admin-row-actions">
    <div class="row-actions">
        <button class="row-action edit" lay-event="edit">编辑</button>
        <button class="row-action delete" lay-event="delete">删除</button>
    </div>
</script>
