<section class="module-view" data-admin-module="categories">
    <article class="panel-card module-panel no-shadow">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input type="text" data-keyword placeholder="搜索关键字，按 Enter 查询">
                <button data-search>查询</button>
            </div>
            <div class="toolbar-actions">
                <button class="primary-button" data-add-record>
                    <i class="layui-icon layui-icon-add-1"></i><span>新增分类</span>
                </button>
                <button class="ghost-button" data-refresh>
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
            </div>
        </div>
        <table id="admin-data-table" lay-filter="admin-data-table"></table>
    </article>
</section>

<script type="application/json" id="module-config-categories">
{
    "endpoint": "/admin/product-categories",
    "id": "categoryId",
    "page": false,
    "title": "产品分类",
    "addLabel": "新增分类",
    "deleteLabel": "分类",
    "columns": [
        {"field": "categoryName", "title": "分类名称", "minWidth": 180, "type": "title"},
        {"field": "level", "title": "层级", "width": 95, "type": "level"},
        {"field": "parentName", "title": "父级分类", "minWidth": 150},
        {"field": "sortOrder", "title": "排序值", "width": 100, "sort": true},
        {"field": "createTime", "title": "创建时间", "width": 165}
    ],
    "fields": [
        {"name": "categoryName", "label": "分类名称", "type": "text", "required": true, "wide": true},
        {"name": "parentId", "label": "父级分类", "type": "parent-category-select"},
        {"name": "sortOrder", "label": "排序值", "type": "number", "required": true}
    ]
}
</script>

<script type="text/html" id="module-editor-categories">
    <div class="admin-editor">
        <div class="editor-grid">
            <div class="editor-field is-wide">
                <label class="required">分类名称</label>
                <input class="editor-input" type="text" name="categoryName">
            </div>
            <div class="editor-field is-wide">
                <label>父级分类</label>
                <select class="editor-select" name="parentId" lay-search lay-filter="parentId">
                    <option value="">无（创建一级分类）</option>
                </select>
            </div>
            <div class="editor-field">
                <label class="required">排序值</label>
                <input class="editor-input" type="number" name="sortOrder">
            </div>
        </div>
    </div>
</script>

<script type="text/html" id="admin-row-actions">
    <div class="row-actions">
        <button class="row-action edit" lay-event="edit">编辑</button>
        <button class="row-action delete" lay-event="delete">删除</button>
    </div>
</script>
