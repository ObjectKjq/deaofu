<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAOFU 管理后台</title>
    <link href="/admin/vendor/layui/css/layui.css" rel="stylesheet">
    <link href="/admin/css/admin.css" rel="stylesheet">
</head>
<body class="admin-app-page">
<div class="admin-shell" id="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar">
        <div class="sidebar-brand">
            <span class="brand-mark">D</span>
            <div><strong>DEAOFU</strong><small>MANAGEMENT</small></div>
        </div>
        <nav class="admin-nav">
            <!-- 一级菜单：仪表盘 -->
            <button class="nav-item nav-item-root is-active" data-module="dashboard">
                <i class="layui-icon layui-icon-console"></i>
                <span>仪表盘</span>
            </button>

            <!-- 二级菜单：内容管理（可折叠） -->
            <div class="nav-group is-open" data-group="content">
                <button class="nav-group-header" type="button" aria-expanded="true">
                    <i class="layui-icon layui-icon-list"></i>
                    <span>内容管理</span>
                    <i class="layui-icon layui-icon-down nav-group-arrow"></i>
                </button>
                <div class="nav-children">
                    <button class="nav-item nav-item-child" data-module="products">
                        <i class="layui-icon layui-icon-component"></i>
                        <span>产品管理</span>
                    </button>
                    <button class="nav-item nav-item-child" data-module="categories">
                        <i class="layui-icon layui-icon-template-1"></i>
                        <span>产品分类</span>
                    </button>
                    <button class="nav-item nav-item-child" data-module="news">
                        <i class="layui-icon layui-icon-read"></i>
                        <span>公司动态</span>
                    </button>
                    <button class="nav-item nav-item-child" data-module="tags">
                        <i class="layui-icon layui-icon-note"></i>
                        <span>动态标签</span>
                    </button>
                </div>
            </div>

            <!-- 二级菜单：企业网络（可折叠） -->
            <div class="nav-group is-open" data-group="network">
                <button class="nav-group-header" type="button" aria-expanded="true">
                    <i class="layui-icon layui-icon-website"></i>
                    <span>企业网络</span>
                    <i class="layui-icon layui-icon-down nav-group-arrow"></i>
                </button>
                <div class="nav-children">
                    <button class="nav-item nav-item-child" data-module="routes">
                        <i class="layui-icon layui-icon-location"></i>
                        <span>运输线路</span>
                    </button>
                    <button class="nav-item nav-item-child" data-module="partners">
                        <i class="layui-icon layui-icon-group"></i>
                        <span>合作企业</span>
                    </button>
                    <button class="nav-item nav-item-child" data-module="consultations">
                        <i class="layui-icon layui-icon-dialogue"></i>
                        <span>咨询信息</span>
                    </button>
                </div>
            </div>
        </nav>
        <div class="sidebar-footer"><span class="system-dot"></span>
            <div><strong>System Online</strong><small>Spring Boot · MySQL</small></div>
        </div>
    </aside>
    <section class="admin-main">
        <header class="admin-topbar">
            <div class="topbar-leading">
                <button class="icon-button sidebar-toggle" id="sidebar-toggle" title="折叠/展开侧边栏">
                    <i class="layui-icon layui-icon-left" id="sidebar-toggle-icon"></i>
                </button>
            </div>
            <div class="topbar-actions"><span class="today" id="today-label"></span>
                <div class="user-chip"><span class="user-avatar">A</span>
                    <div><strong id="admin-display-name">管理员</strong><small>Administrator</small></div>
                </div>
                <button class="icon-button" id="logout-button" title="退出登录"><i
                        class="layui-icon layui-icon-logout"></i></button>
            </div>
        </header>
        <nav class="admin-breadcrumb" aria-label="面包屑导航">
            <span class="topbar-caption">DEAOFU /</span>
            <strong id="current-section">仪表盘</strong>
        </nav>
        <main class="admin-workspace" id="admin-workspace">
            <div class="workspace-loader"><span></span>
                <p>正在载入工作区</p></div>
        </main>
    </section>
</div>
<div id="sidebar-tooltip" class="sidebar-tooltip" role="tooltip" aria-hidden="true"></div>
<script src="/admin/vendor/layui/layui.js"></script>
<script src="/admin/vendor/gsap/gsap.min.js"></script>
<script src="/admin/js/admin.js"></script>
</body>
</html>
